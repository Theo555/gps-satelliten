name: Tests

# Läuft bei jedem Push auf main und bei Pull Requests.
# Prüft nur die Unit-Tests – kein Release, keine Secrets, kein Gerät.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Bei mehreren Pushes kurz hintereinander nur den letzten Lauf behalten
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric lädt beim ersten Testlauf die Android-JARs aus Maven Central
      # nach (~/.m2). Ohne Zwischenspeicher hängt jeder Lauf am Netz – am
      # 05.11. ist genau das schiefgegangen: alle Robolectric-Tests scheiterten
      # mit "IOException" im MavenArtifactFetcher, ohne dass der Code schuld war.
      - name: Robolectric-JARs zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Bei Fehlschlag den HTML-Bericht als Download bereitstellen,
      # damit man nicht nur im Log suchen muss.
      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  # Zwei Prüfungen, die bisher nur im lokalen pre-commit-Hook hingen. Ein Hook
  # lässt sich mit --no-verify umgehen und läuft in einem frischen Klon gar
  # nicht (core.hooksPath wird pro Klon gesetzt) – hier gelten sie immer.
  ordnung:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Schichtgrenzen (model/ bleibt Android-frei)
        run: tools/check-architecture.sh

      - name: Bildordner und READMEs
        run: tools/check-screenshots.sh

  # Lint findet, was Tests nicht finden: API-Aufrufe ohne Versionswache
  # (Absturz auf Android 7), nicht konfigurationsbewusste Texte und dergleichen.
  # Am 18.11.2026 fand genau das einen echten Fehler: GnssMeasurement.getCodeType
  # (ab API 29) stand als einziger Aufruf ohne Wache und hätte auf Android 7–9
  # geworfen.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Lint-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # R8 und das Ressourcen-Schrumpfen laufen nur im Release-Build. Bisher wurde
  # der erst beim Veröffentlichen gebaut – ein Fehler in den ProGuard-Regeln fiel
  # damit erst dann auf. Ohne Keystore entsteht eine unsignierte APK; signiert
  # wird weiterhin nur im Release-Workflow.
  release-bau:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release bauen (ohne Signatur)
        run: ./gradlew assembleRelease --console=plain

      - name: Ergebnis prüfen
        run: |
          set -e
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk" || { echo "Keine Release-APK entstanden"; exit 1; }
          ls -l "$apk"
