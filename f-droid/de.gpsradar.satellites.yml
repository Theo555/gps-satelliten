# Hinweise für später:
# - Bei jedem neuen Release einen Eintrag unter Builds ergänzen und
#   CurrentVersion/CurrentVersionCode nachziehen. Mit AutoUpdateMode: Version
#   kann F-Droid das selbst tun, sobald ein Tag gepusht wird.
# - changelogs/<versionCode>.txt muss es in fastlane geben, sonst zeigt
#   F-Droid keinen Changelog an.
# - Screenshots gehoeren nach
#   fastlane/metadata/android/<locale>/images/phoneScreenshots/
