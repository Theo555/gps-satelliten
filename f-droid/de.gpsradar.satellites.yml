  - Science & Education

License: MIT

AuthorName: TK
AuthorEmail: t.kichtan@gmail.com

SourceCode: https://github.com/Theo555/gps-satelliten
IssueTracker: https://github.com/Theo555/gps-satelliten/issues

RepoType: git
Repo: https://github.com/Theo555/gps-satelliten

Builds:
  - versionName: 1.3.4
    versionCode: 9
    commit: bc8f63adfea11e4a1fe8b290d46b2f11f105f1bd
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

  - versionName: 1.3.3
    versionCode: 8
    commit: f411940868184de386b7f5ab572a1121c5b73f05
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
