# Entwurf für fdroiddata/metadata/de.gpsradar.satellites.yml
#
# Nichts davon ist eingereicht. Zum Einreichen wird diese Datei in einen
# Fork von https://gitlab.com/fdroid/fdroiddata unter metadata/ kopiert
# und ein Merge-Request gestellt.
#
# Vor jeder Änderung prüfen:
#   - commit: immer der vollständige SHA eines Commits, der auf main liegt
#     (git rev-parse "<tag>^{commit}") – niemals ein Branch-Name
#   - versionCode/versionName müssen zum Commit passen
#   - output zeigt auf die unsignierte APK, die F-Droid selbst signiert

Categories:
